<!doctype html>

<html lang="en"><head><meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>UrbanNest – Rental Properties</title>
<link rel="stylesheet" href="style.css">

</head><body><nav id="nav"></nav><div id="app"></div><div id="toast"></div>

<script>

const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const money=n=>'Rs '+Number(n).toLocaleString();

const ST=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};

const EM={Apartment:'🏢',Villa:'🏡',Penthouse:'🌆',Studio:'🛋️',House:'🏠'},TYPES=Object.keys(EM),CITIES=['Seaside Bay','Downtown Metro','Sunset Valley','Green Hills'],FUR=['Fully Furnished','Semi-Furnished','Unfurnished'];

const AM=['High-Speed Fiber WiFi','Air Conditioning','Gym Access','Swimming Pool','24/7 Security','Covered Parking','Balcony','Laundry Room','Concierge'];

const AG=[['Sophia Martinez','Senior Luxury Leasing Agent'],['Daniel Carter','Leasing Consultant'],['Amelia Brooks','Property Manager'],['Noah Bennett','Leasing Agent']];

const ROWS=`Skyline Luxury Penthouse with Ocean View|Penthouse|3850|180|3|3|2450|Seaside Bay|742 Ocean Boulevard, Suite 28A|1|1|1|0|4.95|42

Modern Downtown Loft Apartment|Apartment|2200|120|2|2|1100|Downtown Metro|88 Central Avenue|1|0|1|1|4.7|31

Cozy Studio Near Metro Station|Studio|950|50|1|1|480|Downtown Metro|12 Station Road|1|1|0|2|4.4|18

Sunset Valley Family Villa|Villa|4200|250|4|3|3200|Sunset Valley|5 Sunset Drive|1|0|1|0|4.85|27

Green Hills Garden House|House|2600|100|3|2|1900|Green Hills|31 Garden Lane|1|0|1|1|4.6|22

Seaside Bay Beachfront Apartment|Apartment|2900|150|2|2|1250|Seaside Bay|9 Shoreline Walk|1|1|1|0|4.8|36

Minimalist Studio with City Skyline|Studio|1100|60|1|1|520|Downtown Metro|140 Skyline Street|0|1|0|0|4.5|14

Hilltop Modern Villa with Pool|Villa|5600|300|5|4|4100|Green Hills|1 Hilltop Crest|0|0|1|0|4.9|19

Sunset Valley Spacious 2BHK|Apartment|1750|90|2|2|980|Sunset Valley|66 Valley View Road|0|0|1|2|4.3|25

Downtown Executive Penthouse|Penthouse|4800|220|3|3|2700|Downtown Metro|300 Grand Plaza, Floor 40|0|0|0|0|4.75|16

Green Hills Cozy Cottage|House|1500|70|2|1|1150|Green Hills|18 Pine Cottage Way|0|1|1|1|4.55|20

Seaside Bay Smart Studio|Studio|1250|65|1|1|560|Seaside Bay|21 Harbor Street|0|0|0|0|4.35|12`;

let P=ROWS.split('\n').map((r,i)=>{const f=r.split('|');return{id:i+1,title:f[0],type:f[1],price:+f[2]*120,deposit:+f[2]*120,maint:+f[3]*120,beds:+f[4],baths:+f[5],area:+f[6],city:f[7],addr:f[8],feat:+f[9],isNew:+f[10],pet:+f[11],fur:FUR[+f[12]],rating:+f[13],rev:+f[14],am:AM.filter((_,k)=>(k+i)%3!==0||k<3),agent:AG[i%4]}});

// 38 additional demo properties: 50 sample listings in total.
const EXTRA_NAMES=[
'Riverside Grand Family Residence','Golden Gate Luxury Apartment','Palm Court Garden Villa','Metro Heights Executive Suite','Bluewater Marina Penthouse','Cedar Grove Family Home','The Grand Central Residence','Sunset Terrace Villa','Emerald Park Apartment','Harbor Lights Studio','Royal Crest Penthouse','Maple Leaf Townhouse','Sky Garden Duplex','Parkside Modern Residence','Ocean Pearl Apartment','Hillview Estate Villa','Central Square Studio','Lakeside Luxury Home','The Meridian Penthouse','Willow Creek Cottage','Aurora Heights Apartment','Palm Avenue Villa','Crown Plaza Residence','Seabreeze Family House','The Vertex Sky Suite','Garden District Apartment','Silver Oak Villa','Downtown Signature Loft','Coral Bay Residence','The Summit Penthouse','Meadowbrook Family Home','City Lights Studio','The Boulevard Apartment','Grandview Luxury Villa','Northstar Executive Residence','The Atrium Duplex','Rosewood Garden House','Marina View Apartment'
];
const EXTRA_TYPES=['House','Apartment','Villa','Penthouse','Studio','Apartment','House','Villa','Apartment','Studio','Penthouse','House','Apartment','House','Apartment','Villa','Studio','House','Penthouse','House','Apartment','Villa','Penthouse','House','Penthouse','Apartment','Villa','Apartment','House','Penthouse','House','Studio','Apartment','Villa','Apartment','Apartment','House','Apartment'];
const EXTRA_STREETS=['Riverside Drive','Golden Gate Avenue','Palm Court Road','Metro Heights Boulevard','Marina Walk','Cedar Grove Lane','Grand Central Street','Sunset Terrace','Emerald Park Road','Harbor Lights Way','Royal Crest Avenue','Maple Leaf Street','Sky Garden Boulevard','Parkside Lane','Ocean Pearl Drive','Hillview Estate Road','Central Square','Lakeside Drive','Meridian Tower Road','Willow Creek Lane'];
const EXTRA_CITIES=['Seaside Bay','Downtown Metro','Sunset Valley','Green Hills'];
const EXTRA=EXTRA_NAMES.map((title,i)=>{const id=i+13,type=EXTRA_TYPES[i],city=EXTRA_CITIES[i%4],beds=type==='Studio'?1:2+(i%4),price=85000+((i*17391)%575000),area=type==='Studio'?480+(i%5)*65:950+(i*137)%3100;return {id,title,type,price,deposit:price,maint:Math.round(price*.08),beds,baths:Math.max(1,Math.min(4,beds-(i%2))),area,city,addr:`${10+i*7} ${EXTRA_STREETS[i%EXTRA_STREETS.length]}`,feat:i%3===0?1:0,isNew:i%5===0?1:0,pet:i%3===1?1:0,fur:FUR[i%3],rating:+(4.2+(i%8)*.1).toFixed(2),rev:12+(i*7)%65,am:AM.filter((_,k)=>(k+i)%3!==0||k<3),agent:AG[i%4]}});
P=P.concat(EXTRA);
const ex=ST('un_extra');if(Array.isArray(ex))P=P.concat(ex);

let V='home',DID=1,G=0,FAV=ST('un_fav')||[],Q={q:'',t:[],max:900000,b:'any',pet:false,sort:'def',view:'grid'},HQ={t:'All'},W={step:1,d:{}};

let TH=ST('un_theme')||'dark';

const applyTheme=()=>document.documentElement.setAttribute('data-theme',TH);applyTheme();

function toast(t){const e=$('#toast');e.innerHTML=`<div class="t">${esc(t)}</div>`;setTimeout(()=>e.innerHTML='',2400)}

function toggleTheme(){TH=TH==='light'?'dark':'light';ST('un_theme',TH);applyTheme();navDraw();toast('Switched to '+(TH==='dark'?'Black':'Golden')+' Theme')}

const PAGES=[['home','Home'],['listings','Listings'],['list-property','List Property'],['about','About'],['blog','Blog'],['contact','Contact']];

function navDraw(){$('#nav').innerHTML=`<span class="logo" onclick="go('home')">Urban<b>Nest</b></span>${PAGES.map(p=>`<button class="lk ${V===p[0]||(V==='details'&&p[0]==='listings')?'on':''}" onclick="go('${p[0]}')">${p[1]}</button>`).join('')}<span class="sp"></span><button class="btn sm" onclick="go('listings');Q.saved=!Q.saved;go('listings')">❤ Saved (${FAV.length})</button><button class="btn sm" onclick="toggleTheme()" title="Theme">${TH==='dark'?'✨ Golden':'🖤 Black'}</button>`}

function go(v,id){V=v;if(id)DID=id;if(v==='details')G=0;if(v!=='listings')Q.saved=false;W=v==='list-property'?{step:1,d:{}}:W;draw();scrollTo(0,0)}

function draw(){navDraw();$('#app').innerHTML=`<div class="wrap">${PG[V]()}</div><footer>© UrbanNest – Property Rental Demo · 50 sample listings · Zulqarnain, Abdullah, Shahroz</footer>`;if(V==='listings')applyF()}

const hue=p=>(p.id*7)%30+30,bg=(h,a=0)=>`background:linear-gradient(${135+a}deg,hsl(${h} 60% 45%),hsl(${h+40} 65% 28%))`;

function card(p){return `<div class="card pc" onclick="go('details',${p.id})"><div class="th" style="${bg(hue(p))}">${scene(p,0)}${p.isNew?'<span class="pill">NEW</span>':''}<button class="heart" onclick="event.stopPropagation();fav(${p.id})">${FAV.includes(p.id)?'❤️':'🤍'}</button></div>

<div class="pad" style="flex:1"><div class="price">${money(p.price)}<span class="mu">/month</span></div><b>${esc(p.title)}</b><div class="mu">📍 ${esc(p.addr)}, ${esc(p.city)}</div>

<div class="mu" style="margin:6px 0">🛏 ${p.beds} · 🛁 ${p.baths} · 📐 ${p.area} sq ft · ⭐ ${p.rating} (${p.rev})</div><span class="tag">${p.type}</span><span class="tag">${p.fur}</span>${p.pet?'<span class="tag">🐾 Pets OK</span>':''}</div></div>`}

function fav(id){FAV=FAV.includes(id)?FAV.filter(x=>x!==id):[...FAV,id];ST('un_fav',FAV);toast(FAV.includes(id)?'Saved to Your Favorites!':'Removed from Saved Listings');V==='listings'?(applyF(),navDraw()):draw()}

const PG={};

/* HOME */

PG.home=()=>`<div class="hero home-hero"><div class="sky">${skyline()}</div><h1>Find your next home, with zero hidden fees.</h1><p>Verified apartments, villas, penthouses and studios. Transparent move-in costs and virtual tours.</p>

<div class="tabs">${['All','Apartment','Villa','Penthouse','Studio','House'].map(t=>`<button class="${HQ.t===t?'on':''}" onclick="HQ.t='${t}';draw()">${t==='All'?'All':t+'s'}</button>`).join('')}</div>

<div class="sbox"><label class="fl">City<select id="hc"><option value="">Any city</option>${CITIES.map(c=>`<option>${c}</option>`).join('')}</select></label>

<label class="fl">Max budget (Rs/month)<select id="hb"><option value="900000">Any</option><option>200000</option><option>350000</option><option>500000</option><option>700000</option><option>900000</option></select></label>

<label class="fl">Bedrooms<select id="hr"><option value="any">Any</option><option>1</option><option>2</option><option>3</option><option value="4">4+</option></select></label>

<button class="btn p" onclick="homeSearch()">Search</button></div></div>

<section class="building-showcase" aria-label="Featured building architecture">
  <div class="showcase-heading"><div><span class="eyebrow">URBANNEST SIGNATURE COLLECTION</span><h2>Explore impressive city living</h2><p class="mu">A closer look at striking architecture, premium high-rises and modern urban spaces.</p></div><span class="showcase-count">01 — 03</span></div>
  <div class="building-gallery">
    <article class="building-feature">
      <img src="https://images.unsplash.com/photo-1763541687356-c4738daad35c?auto=format&fit=crop&w=1800&q=85" alt="Tall modern glass skyscraper with geometric facade" fetchpriority="high">
      <div class="building-caption"><span>01 / ICONIC SKYLINE</span><h3>Architecture that stands tall</h3><p>Discover homes surrounded by remarkable city views.</p></div>
    </article>
    <article class="building-tile">
      <img src="https://images.unsplash.com/photo-1777259587331-46511930ee97?auto=format&fit=crop&w=1100&q=85" alt="Modern high-rise building with reflective windows" loading="lazy">
      <div class="building-caption"><span>02 / MODERN DESIGN</span><h3>Refined city spaces</h3></div>
    </article>
    <article class="building-tile">
      <img src="https://images.unsplash.com/photo-1760205326038-4722a1be203c?auto=format&fit=crop&w=1100&q=85" alt="Contemporary glass office tower exterior" loading="lazy">
      <div class="building-caption"><span>03 / URBAN LIVING</span><h3>Made for the skyline</h3></div>
    </article>
  </div>
  <p class="photo-credit">Architecture photography: <a href="https://unsplash.com/license" target="_blank" rel="noopener">Unsplash License</a>.</p>
</section>

<div class="stats">${[['15,000+','Happy Tenants'],['4,800+','Verified Units'],['98.5%','Satisfaction Rate'],['24/7','Emergency Support']].map(s=>`<div class="card pad"><div class="n">${s[0]}</div><div class="mu">${s[1]}</div></div>`).join('')}</div>

<div class="inventory-banner card pad"><div><span class="eyebrow">THE URBANNEST COLLECTION</span><h2 style="margin:4px 0">Explore all 50 sample homes</h2><p class="mu" style="margin:0">Apartments, family houses, villas, studios and penthouses across four neighborhoods.</p></div><button class="btn p" onclick="Q={q:'',t:[],max:900000,b:'any',pet:false,sort:'def',view:'grid'};go('listings')">Browse all 50 homes →</button></div><h2>Featured Properties</h2><div class="grid">${P.filter(p=>p.feat).slice(0,8).map(card).join('')}</div>

<h2>Explore Neighborhoods</h2><div class="grid">${CITIES.map((c,i)=>`<div class="card pc" onclick="Q.q='${c}';go('listings')"><div class="th">${scene({id:i*3+1,type:['Penthouse','Villa','House','Apartment'][i]},[0,1,3,4][i])}<b style="position:absolute;bottom:10px;left:14px;z-index:2;font-size:20px;color:#fff;text-shadow:0 2px 6px #000">${c}</b></div><div class="pad mu">${P.filter(p=>p.city===c).length} rentals available</div></div>`).join('')}</div>

<h2>Why Choose Us</h2><div class="grid">${[['🔍','1. Search & Discover','Filter verified listings by city, price and type.'],['📅','2. Book a Viewing','Pick an in-person tour or a live 3D virtual walkthrough.'],['🔑','3. Sign Lease & Move In','See every upfront cost before you sign.']].map(s=>`<div class="card pad"><div style="font-size:30px">${s[0]}</div><h3>${s[1]}</h3><span class="mu">${s[2]}</span></div>`).join('')}</div>

<h2>Tenant Testimonials</h2><div class="grid">${[['Hamza R.','Found a pet-friendly apartment in two days. The cost table had no surprises.'],['Maria L.','The virtual tour saved me a trip across the city. Highly recommended.'],['Ali S.','Transparent deposits and a very helpful agent. Smooth move-in.']].map(t=>`<div class="card pad"><div>⭐⭐⭐⭐⭐</div><p>“${t[1]}”</p><div style="display:flex;gap:10px;align-items:center">${face(t[0],40)}<b>${t[0]}</b></div></div>`).join('')}</div>

<div class="hero" style="margin-top:26px;text-align:center"><h2 style="margin:0 0 6px">Own a property?</h2><p style="margin:0 auto 14px">List your unit in 4 easy steps.</p><button class="btn" style="color:#7a5a00" onclick="go('list-property')">List your property</button></div>`;

function homeSearch(){Q={...Q,q:'',t:HQ.t==='All'?[]:[HQ.t],max:+$('#hb').value,b:$('#hr').value,pet:false,saved:false};const c=$('#hc').value;Q.q=c;go('listings')}

/* LISTINGS */

PG.listings=()=>`<div class="lay"><div class="card pad side"><h3>Filters</h3><label class="fl">Search<input id="fq" value="${esc(Q.q)}" oninput="Q.q=this.value;debounce()" placeholder="Title, city or address"></label>

<b>Property type</b>${TYPES.map(t=>`<label><input type="checkbox" ${Q.t.includes(t)?'checked':''} onchange="tg('${t}')"> ${t}</label>`).join('')}

<label class="fl">Max price: <b id="pv">${money(Q.max)}</b><input type="range" min="100000" max="900000" step="5000" value="${Q.max}" oninput="Q.max=+this.value;$('#pv').textContent=money(Q.max);applyF()"></label>

<b>Bedrooms</b>${[['any','Any'],['1','1 BHK'],['2','2 BHK'],['3','3 BHK'],['4','4+ BHK']].map(b=>`<label><input type="radio" name="b" ${Q.b===b[0]?'checked':''} onchange="Q.b='${b[0]}';applyF()"> ${b[1]}</label>`).join('')}

<label style="margin-top:8px"><input type="checkbox" ${Q.pet?'checked':''} onchange="Q.pet=this.checked;applyF()"> 🐾 Pet-friendly only</label>

<button class="btn sm" style="margin-top:8px" onclick="Q={q:'',t:[],max:900000,b:'any',pet:false,sort:'def',view:'grid'};draw()">Reset</button></div>

<div><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px"><b id="cnt" style="margin-right:auto"></b><span class="mu">50 sample listings in this demo</span>

<select id="so" style="width:auto" onchange="Q.sort=this.value;applyF()">${[['def','Sort: Recommended'],['pa','Price: Low to High'],['pd','Price: High to Low'],['rt','Highest Rated'],['nw','Newest']].map(s=>`<option value="${s[0]}" ${Q.sort===s[0]?'selected':''}>${s[1]}</option>`).join('')}</select>

<button class="btn sm" onclick="Q.view=Q.view==='grid'?'list':'grid';applyF()" id="vw"></button></div><div id="res"></div></div></div>`;

let dT;const debounce=()=>{clearTimeout(dT);dT=setTimeout(applyF,250)};

function tg(t){Q.t=Q.t.includes(t)?Q.t.filter(x=>x!==t):[...Q.t,t];applyF()}

function applyF(){const q=Q.q.toLowerCase().trim();

let r=P.filter(p=>(!q||[p.title,p.city,p.addr].some(s=>s.toLowerCase().includes(q)))&&p.price<=Q.max&&(!Q.t.length||Q.t.includes(p.type))&&(Q.b==='any'||(Q.b==='4'?p.beds>=4:p.beds===+Q.b))&&(!Q.pet||p.pet)&&(!Q.saved||FAV.includes(p.id)));

const S={pa:(a,b)=>a.price-b.price,pd:(a,b)=>b.price-a.price,rt:(a,b)=>b.rating-a.rating,nw:(a,b)=>(b.isNew-a.isNew)||b.id-a.id};if(S[Q.sort])r.sort(S[Q.sort]);

$('#cnt').textContent=r.length+' propert'+(r.length===1?'y':'ies')+(Q.saved?' (saved)':'');$('#vw').textContent=Q.view==='grid'?'☰ List view':'▦ Grid view';

$('#res').className=Q.view==='list'?'list':'';$('#res').innerHTML=r.length?`<div class="grid">${r.map(card).join('')}</div>`:'<div class="card pad mu">No properties match your filters.</div>'}

/* DETAILS */

function skyline(){let s='<svg viewBox="0 0 500 260" preserveAspectRatio="xMaxYMax slice" style="width:100%;height:100%"><g fill="rgba(255,255,255,.2)">';

[[10,90],[60,150],[120,110],[170,200],[240,130],[300,180],[360,100],[410,160],[460,120]].forEach(([x,h])=>{s+=`<rect x="${x}" y="${260-h}" width="48" height="${h}"/>`;for(let y=260-h+10;y<246;y+=16)for(let k=0;k<3;k++)if((x+y+k*7)%3)s+=`<rect x="${x+8+k*13}" y="${y}" width="7" height="9" fill="rgba(255,236,150,.6)"/>`});return s+'</g></svg>'}

const SK=['#f1c27d','#e0ac69','#c68642','#8d5524'],HR=['#2b1b0e','#4a2c12','#111','#7a4a1d'];

const face=(n,z=44)=>{const k=[...n].reduce((a,c)=>a+c.charCodeAt(0),0);return `<svg class="face" width="${z}" height="${z}" viewBox="0 0 40 40"><circle cx="20" cy="20" r="20" fill="hsl(${35+k%20} 60% 40%)"/><ellipse cx="20" cy="38" rx="14" ry="10" fill="hsl(${k%360} 30% 28%)"/><circle cx="20" cy="17" r="8" fill="${SK[k%4]}"/><path d="M12 16a8 8 0 0 1 16 0c-3-3-12-3-16 0z" fill="${HR[(k>>1)%4]}"/></svg>`};

const SL=['Front View','Sunset View','Night View','Side View','Garden & Street'],SKY=[['#7dd3fc','#e0f2fe'],['#f97316','#fde68a'],['#0f172a','#4c1d95'],['#38bdf8','#bae6fd'],['#0ea5e9','#a7f3d0']];

const PROPERTY_PHOTOS=[
  'https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=1200&q=85',
  'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1200&q=85',
  'https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=1200&q=85',
  'https://images.unsplash.com/photo-1600566753086-00f18fb6b3ea?auto=format&fit=crop&w=1200&q=85',
  'https://images.unsplash.com/photo-1600047509807-ba8f99d2cdde?auto=format&fit=crop&w=1200&q=85'
];
function scene(p,v){
  const photo=PROPERTY_PHOTOS[(p.id+v)%PROPERTY_PHOTOS.length];
  return `<img src="${photo}" alt="${esc(p.title)} — building photo" loading="lazy">`;
}

const SE=['🛋️','🛏️','🍳','🛁','🌇'];

PG.details=()=>{const p=P.find(x=>x.id===DID)||P[0],h=hue(p),tot=p.price+p.deposit+p.maint;

return `<button class="btn sm" onclick="go('listings')">← Back to listings</button><h2 style="margin-top:12px">${esc(p.title)}</h2><div class="mu">📍 ${esc(p.addr)}, ${esc(p.city)} · ⭐ ${p.rating} (${p.rev} reviews)</div>

<div class="two" style="margin-top:14px"><div><div class="gal" id="gal">${scene(p,G)}<span>${SL[G]}</span></div><div class="thumbs">${SE.map((e,i)=>`<div class="${i===G?'on':''}" onclick="G=${i};draw()">${scene(p,i)}</div>`).join('')}</div>

<div class="card pad" style="margin-top:16px"><h3>Overview</h3><p>${p.type} with ${p.beds} bedroom(s), ${p.baths} bathroom(s) and ${p.area} sq ft of living space, ${p.fur.toLowerCase()}. ${p.pet?'Pets are welcome.':'Pets are not allowed.'}</p>${p.am.map(a=>`<span class="tag">✓ ${a}</span>`).join('')}</div></div>

<div><div class="card pad"><div class="price">${money(p.price)}<span class="mu">/month</span></div><h3 style="margin-top:12px">Move-in cost</h3><table><tr><td>1st month rent</td><td>${money(p.price)}</td></tr><tr><td>Refundable security deposit</td><td>${money(p.deposit)}</td></tr><tr><td>Building maintenance fee</td><td>${money(p.maint)}</td></tr><tr class="tot"><td>Total due at lease signing</td><td>${money(tot)}</td></tr></table>

<button class="btn" style="width:100%;margin-top:10px" onclick="fav(${p.id})">${FAV.includes(p.id)?'❤️ Saved':'🤍 Save property'}</button></div>

<div class="card pad" style="margin-top:14px"><h3>Book a tour</h3><label class="fl">Tour type<select id="tt"><option>In-Person Tour</option><option>Live 3D Virtual Walkthrough</option></select></label><label class="fl">Date<input id="td" type="date"></label>

<label class="fl">Time slot<select id="tm"><option>10:00 AM</option><option>1:00 PM</option><option>4:00 PM</option><option>7:00 PM</option></select></label><button class="btn p" style="width:100%" onclick="tour()">Confirm tour</button></div>

<div class="card pad" style="margin-top:14px;display:flex;gap:12px;align-items:center">${face(p.agent[0],52)}<div><b>${p.agent[0]}</b><div class="mu">${p.agent[1]}</div><div class="mu">📞 +1 (555) 234-89${String(p.id).padStart(2,'0')} · ✉ ${p.agent[0].split(' ')[0].toLowerCase()}@urbannest.com</div></div></div></div></div>`};

function tour(){const d=$('#td');if(!d.value||d.value<new Date().toISOString().slice(0,10)){d.classList.add('bad');return toast('Please choose a valid future date')}toast(`${$('#tt').value} confirmed for ${d.value}, ${$('#tm').value}`)}

/* WIZARD */

const WS=['Basic Information','Location & Specs','Amenities & Photos','Contact & Review'];

const wf=(id,l,t='text',a='')=>`<label class="fl">${l}<input id="${id}" type="${t}" ${a} value="${esc(W.d[id]??'')}"></label>`;

const ws=(id,l,o)=>`<label class="fl">${l}<select id="${id}">${o.map(x=>`<option ${W.d[id]===x?'selected':''}>${x}</option>`).join('')}</select></label>`;

PG['list-property']=()=>{const s=W.step,d=W.d;let b='';

if(s===1)b=`<div class="fr">${wf('title','Listing title (min 10 chars)')}${ws('type','Category',TYPES)}${ws('fur','Furnishing',FUR)}${wf('price','Monthly rent (Rs, above 100000)','number','min=100001')}${wf('deposit','Security deposit (Rs)','number','min=0')}</div>`;

if(s===2)b=`<div class="fr">${wf('addr','Street address')}${ws('city','City',CITIES)}${wf('area','Total area (sq ft, over 100)','number')}${wf('beds','Bedrooms','number','min=0')}${wf('baths','Bathrooms','number','min=1')}</div>`;

if(s===3)b=`<b>Amenities</b><div class="fr" style="margin:8px 0">${AM.map(a=>`<label><input type="checkbox" class="am" value="${a}" ${(d.am||[]).includes(a)?'checked':''}> ${a}</label>`).join('')}</div><label><input type="checkbox" id="pet" ${d.pet?'checked':''}> 🐾 Pets allowed</label>

<label class="fl" style="margin-top:12px">Photos (drag and drop or click)<input type="file" id="ph" accept="image/*" multiple onchange="prev(this)"></label><div id="pv2" style="display:flex;gap:8px;flex-wrap:wrap"></div>`;

if(s===4)b=`<div class="fr">${wf('oname','Owner full name')}${wf('phone','Phone','tel')}${wf('email','Email','email')}</div><div class="card pad" style="margin-top:14px"><h3>Review</h3><div class="mu">${esc(d.title)} · ${d.type} · ${d.fur}<br>${money(d.price||0)}/month, deposit ${money(d.deposit||0)}<br>📍 ${esc(d.addr)}, ${d.city} · ${d.area} sq ft · ${d.beds} bed · ${d.baths} bath<br>${(d.am||[]).join(', ')||'No amenities'}${d.pet?' · Pets OK':''}</div></div>`;

return `<h2 style="margin-top:0">List your property</h2><div class="steps">${WS.map((_,i)=>`<div class="${i<s?'on':''}"></div>`).join('')}</div><div class="card pad" style="max-width:760px"><h3>Step ${s}: ${WS[s-1]}</h3>${b}

<div style="margin-top:14px;display:flex;gap:8px">${s>1?'<button class="btn" onclick="wn(-1)">Back</button>':''}<button class="btn p" onclick="wn(1)">${s===4?'Submit listing':'Next'}</button></div></div>`};

function prev(i){const b=$('#pv2');b.innerHTML='';[...i.files].slice(0,6).forEach(f=>{const im=document.createElement('img');im.src=URL.createObjectURL(f);im.style.cssText='width:80px;height:60px;object-fit:cover;border-radius:8px';b.appendChild(im)})}

function collect(){const s=W.step,g=i=>($('#'+i)||{}).value;

({1:['title','type','fur','price','deposit'],2:['addr','city','area','beds','baths'],4:['oname','phone','email']}[s]||[]).forEach(i=>W.d[i]=g(i));

if(s===3){W.d.am=[...document.querySelectorAll('.am:checked')].map(x=>x.value);W.d.pet=$('#pet').checked}}

function wn(dir){collect();const d=W.d,bad=[];

if(dir>0){const s=W.step;

if(s===1){if((d.title||'').trim().length<10)bad.push('title');if(!(+d.price>100000))bad.push('price');if(d.deposit===''||+d.deposit<0)bad.push('deposit')}

if(s===2){if(!(d.addr||'').trim())bad.push('addr');if(!(+d.area>100))bad.push('area');if(d.beds===''||+d.beds<0)bad.push('beds');if(!(+d.baths>0))bad.push('baths')}

if(s===4){if(!(d.oname||'').trim())bad.push('oname');if(!/^[\d\s+()-]{7,}$/.test(d.phone||''))bad.push('phone');if(!/^\S+@\S+\.\S+$/.test(d.email||''))bad.push('email')}

if(bad.length){bad.forEach(i=>$('#'+i)?.classList.add('bad'));return toast('Please fix the highlighted fields')}

if(s===4){const p={id:Math.max(...P.map(x=>x.id))+1,title:d.title.trim(),type:d.type,price:+d.price,deposit:+d.deposit,maint:9000,beds:+d.beds,baths:+d.baths,area:+d.area,city:d.city,addr:d.addr.trim(),feat:0,isNew:1,pet:d.pet?1:0,fur:d.fur,rating:4.5,rev:0,am:d.am||[],agent:[d.oname.trim(),'Property Owner']};

P.push(p);const e=(ST('un_extra')||[]);e.push(p);ST('un_extra',e);toast('Listing submitted successfully!');return go('details',p.id)}}

W.step+=dir;draw()}

/* ABOUT / BLOG / CONTACT */

PG.about=()=>`<h2 style="margin-top:0">About UrbanNest</h2><div class="card pad"><h3>Our mission</h3><p>We modernized the antiquated rental marketplace through verified leases, honest pricing and zero hidden broker fees.</p></div>

<div class="stats" style="margin:16px 0">${[['50-point','Physical inspection'],['4,800+','Verified units'],['0','Hidden fees']].map(s=>`<div class="card pad"><div class="n">${s[0]}</div><div class="mu">${s[1]}</div></div>`).join('')}</div>

<div class="card pad"><h3>Physical Inspection Guarantee</h3><p class="mu" style="margin:0">Every listing passes a 50-point physical inspection by our own inspectors before it is marked verified.</p></div>

<h2>Leadership Team</h2><div class="grid">${[['Olivia Hart','CEO'],['Marcus Lee','Head of Leasing'],['Priya Nair','Lead Architecture Inspector'],['Ethan Cole','VP of Tenant Relations']].map(t=>`<div class="card pad" style="text-align:center"><span style="display:block;margin:0 auto 8px;width:72px">${face(t[0],72)}</span><b>${t[0]}</b><div class="mu">${t[1]}</div></div>`).join('')}</div>`;

const CK=['Check water pressure and drainage','Test every light and power outlet','Inspect walls, ceiling and floors for damage','Look for signs of damp or mold','Test windows, doors and locks','Check AC and heating','Photograph existing damage','Read the full lease carefully','Confirm deposit return terms','Ask about utilities and maintenance fees'];

PG.blog=()=>`<h2 style="margin-top:0">Renter Guides</h2><div class="card pad"><h3>The First-Time Renter’s Complete Survival Guide</h3><p class="mu">10-step inspection checklist (tick as you go)</p>${CK.map((c,i)=>`<label style="display:block;margin:4px 0"><input type="checkbox"> ${i+1}. ${c}</label>`).join('')}</div>

<h2>Latest articles</h2><div class="grid">${[['💬','Rent negotiation techniques'],['🛡️','Renters insurance essentials'],['🐾','How to draft a pet resume'],['💡','Utility budgeting 101'],['⚖️','Know your tenant rights'],['📝','Lease advice before you sign']].map((a,i)=>`<div class="card pc" onclick="toast('Full article coming soon')"><div class="th" style="height:120px">${scene({id:i*5+2,type:['Apartment','Villa','House','Studio','Penthouse','Apartment'][i]},[0,1,2,3,4,0][i])}<span class="pill" style="font-size:18px;background:var(--card)">${a[0]}</span></div><div class="pad"><b>${a[1]}</b><div class="mu">5 min read</div></div></div>`).join('')}</div>`;

const FQ=[['When is my security deposit returned?','Within 30 days of move-out, after a final inspection.'],['Can I cancel my lease early?','Yes, with 60 days notice. An early termination fee may apply.'],['What is the pet policy?','Check the Pets OK tag on each listing; some need a small pet deposit.'],['How is utility billing handled?','Most buildings bill utilities monthly based on actual usage.'],['Are listings really verified?','Yes. Every listing passes our 50-point inspection.'],['How do I book a tour?','Open any property and use the Book a tour form.']];

PG.contact=()=>`<h2 style="margin-top:0">Support & Contact</h2><div class="grid">${[['🏢','Headquarters','100 Market Square, Downtown Metro'],['🚨','24/7 Emergency Maintenance','+1 (555) 000-9111'],['✉️','Email Support','support@urbannest.com']].map(c=>`<div class="card pad"><div style="font-size:28px">${c[0]}</div><b>${c[1]}</b><div class="mu">${c[2]}</div></div>`).join('')}</div>

<div class="two" style="margin-top:18px;grid-template-columns:1fr 1fr"><div class="card pad"><h3>Send us a message</h3><label class="fl">Name<input id="cn"></label><label class="fl">Email<input id="ce" type="email"></label><label class="fl">Message<textarea id="cm" rows="4"></textarea></label><button class="btn p" onclick="cs()">Send message</button></div>

<div class="card pad faq"><h3>FAQ</h3>${FQ.map(f=>`<button onclick="this.classList.toggle('open')">${f[0]}</button><p>${f[1]}</p>`).join('')}</div></div>`;

function cs(){const ok=[['cn',v=>v.trim()],['ce',v=>/^\S+@\S+\.\S+$/.test(v)],['cm',v=>v.trim().length>=10]].map(([i,f])=>{const e=$('#'+i),g=!!f(e.value);e.classList.toggle('bad',!g);return g}).every(Boolean);

if(!ok)return toast('Please fill all fields correctly');['cn','ce','cm'].forEach(i=>$('#'+i).value='');toast('Message sent. We will reply within 24 hours.')}

draw();

</script></body></html>
